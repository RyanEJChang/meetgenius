<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 · MeetGenius</title>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('meetgenius-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+TC:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('additional_blueprint.static', filename='meetgenius/css/app.css') }}">

  <style>
    body {
      padding-top: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card { width: 100%; max-width: 340px; }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      justify-content: center;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark"><i class="bi bi-soundwave"></i></span>
      MeetGenius
    </div>

    <div class="panel panel-pad stack">
      <div>
        <h1 style="font-size:17px;">登入</h1>
        <p class="text-muted" style="font-size:13px;margin-top:2px;">請輸入你的帳號與密碼。</p>
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-danger">
              <i class="bi bi-exclamation-circle"></i><span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="stack">
        <div class="field">
          <label class="form-label" for="username">帳號或 Email</label>
          <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
          <label class="form-label" for="password">密碼</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">登入</button>
      </form>
    </div>
  </div>
</body>
</html>
